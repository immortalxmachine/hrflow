# HRFlow full stack for local/demo use.
#
# NOTE: This is a documented reference artifact. The project was developed on a
# machine without Docker; tests use an embedded Postgres instead. On any host
# with Docker installed, `docker compose up --build` brings up the whole stack.
#
# Services: db (Postgres 16), api (Spring Boot), payroll-mock (FastAPI), ui (Vite+nginx).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hrflow
      POSTGRES_USER: hrflow
      POSTGRES_PASSWORD: hrflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrflow -d hrflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      HRFLOW_DB_URL: jdbc:postgresql://db:5432/hrflow
      HRFLOW_DB_USER: hrflow
      HRFLOW_DB_PASSWORD: hrflow
      HRFLOW_JWT_SECRET: change-me-in-production-32bytes-minimum!!
      HRFLOW_WEBHOOK_SECRET: dev-webhook-secret
      HRFLOW_PAYROLL_URL: http://payroll-mock:8001/webhooks/leave-approved
      HRFLOW_SEED: "true"   # seed ~200 synthetic employees on first boot
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  payroll-mock:
    build: ./payroll-mock
    environment:
      PAYROLL_WEBHOOK_SECRET: dev-webhook-secret
      PAYROLL_FAIL_RATE: "0.0"
    ports:
      - "8001:8001"

  ui:
    build: ./ui
    depends_on:
      - api
    ports:
      - "5173:80"

volumes: {}
