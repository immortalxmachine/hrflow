name: CI

# Build and test all three components on every push and PR.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run tests (embedded Postgres via zonky, no Docker needed)
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test

  payroll:
    name: Payroll mock (Python 3.13)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payroll-mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install and test
        run: |
          pip install -r requirements.txt
          pytest -q

  ui:
    name: UI (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install and build (type-check + bundle)
        run: |
          npm ci
          npm run build
